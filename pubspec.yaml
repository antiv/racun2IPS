name: invoice2ips
description: "Invoice2IPS — skeniranje računa i generisanje NBS IPS QR koda"
publish_to: 'none'

# Verzija prati Tauri projekat (invoice2ips): versionName+versionCode.
version: 1.0.23+1000022

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Kamera: preview, fotografisanje, lampa (torch), izbor rezolucije.
  camera: ^0.12.0
  # Izbor slike iz galerije.
  image_picker: ^1.2.2
  # Render IPS QR koda.
  qr_flutter: ^4.1.0
  # Gemini REST API poziv (ekstrakcija podataka sa računa).
  dio: ^5.9.2
  # Deljenje QR koda kao slike.
  share_plus: ^13.2.0
  # Verzija aplikacije u info sheet-u.
  package_info_plus: ^10.2.0
  # Link ka antonijevic.rs.
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  # Lokalno čuvanje sačuvanih IPS kodova.
  shared_preferences: ^2.5.5
  # Izbor .json fajla za uvoz sačuvanih kodova (export ide preko share_plus).
  # 12.0.0-beta jer stabilni 11.x still cilja win32 ^5.x, što je u sukobu sa
  # package_info_plus (win32 ^6.x); Windows deo se i onda kompajlira kao deo
  # kernel snapshot-a čak i za iOS/Android build, pa override verzije ne radi.
  file_picker: ^12.0.0-beta.7
  # Native prompt za ocenjivanje (Play In-App Review / SKStoreReviewController).
  in_app_review: ^2.0.12
  # Lokalni OCR na uređaju (pre slanja na Gemini AI).
  google_mlkit_text_recognition: ^0.17.1
  # Lokalna detekcija postojećeg NBS IPS QR koda na slici računa.
  google_mlkit_barcode_scanning: ^0.16.1
  lucide_icons_flutter: ^4.0.1
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/images/

  # Inter (OFL, assets/fonts/OFL.txt) — font iz dizajna.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
